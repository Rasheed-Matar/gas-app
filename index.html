<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>نقطة الغاز</title>
<style>
:root{--g:#1f6f54;--g2:#14503c;--gold:#c9a24b;--bg:#f6f3ea;--card:#fff;--tx:#1d2a24;--mut:#6b7a72;--red:#b3392f;--ln:#e6e0d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;padding:12px 14px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header #instBtn{background:var(--gold);color:#fff;font-weight:700}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:13px}
main{padding:12px 12px 96px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px}
nav button.on{color:var(--g);font-weight:700}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px}
.stat small{color:var(--mut);display:block;font-size:12px}
.stat b{font-size:20px}
.stat.hi{background:var(--g);color:#fff;border-color:var(--g)}
.stat.hi small{color:#d6efe5}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.pos{color:var(--g)}.neg{color:var(--red)}
h2{font-size:15px;margin:14px 2px 8px;color:var(--g2)}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:#eef3ef;color:var(--g2);margin-inline-start:4px}
.badge.app{background:#f6ecd3;color:#7a5c12}
.entry.void{opacity:.45;text-decoration:line-through}
.entry .top{display:flex;justify-content:space-between;font-weight:700}
.btn{border:0;border-radius:12px;padding:11px 14px;font-size:15px;background:var(--g);color:#fff;width:100%}
.btn.sec{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.red{background:var(--red)}
.btn.sm{width:auto;padding:5px 10px;font-size:12px;border-radius:9px}
.fab{position:fixed;bottom:74px;left:16px;z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--gold);color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--tx)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end}
#modal.on{display:flex}
#sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px;max-width:640px;margin:0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prev{background:#eef6f1;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:14px}
.prev.warn{background:#fbe9e6;color:var(--red)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;z-index:30;display:none}
.menu button{display:flex;width:100%;align-items:center;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:8px;font-size:16px;color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;text-align:start;border-bottom:1px solid var(--ln)}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:end}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
